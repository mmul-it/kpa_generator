---

galaxy_info:
  role_name: kpa_generator
  namespace: mmul
  author: Raoul Scarazzini (rasca@mmul.it)
  description: |
    This role takes a KPA project (https://github.com/mmul-it/kpa) and creates
    markdown files for slides (to be processed by Marp), agenda and book (to be
    processed by pandoc) to generate rendered pdf files.
  license: license (MIT)
  min_ansible_version: '2'
  platforms:
    - name: Debian
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
    - name: EL
      versions:
        - all
    - name: Fedora
      versions:
        - all
  galaxy_tags:
    - kpa
    - marp
    - markdown

dependencies: []
